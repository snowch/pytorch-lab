name: Verify and deploy PyTorch Lab
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node tests/shared-browser.cjs && node tests/update-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-course-browser-checks
          path: test-results/
          if-no-files-found: ignore
      - name: Retain verified releases for older open tabs
        if: github.ref == 'refs/heads/main'
        run: node scripts/retain-for-publish.mjs
        env:
          PUBLISHED_COURSE_URL: https://snowch.github.io/pytorch-lab/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
